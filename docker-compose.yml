

services:
  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${DB_USER:-polyglot}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-polyglot}
      - POSTGRES_INITDB_ARGS=-c shared_preload_libraries=pg_stat_statements
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - polyglot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-polyglot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - polyglot
    restart: unless-stopped
    networks:
      - polyglot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  polyglot:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      go-processor:
        condition: service_healthy
    environment:
      # Load from .env file (copy from .env.example)
      - MIX_ENV=prod
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-polyglot}
      - DB_PASSWORD=${DB_PASSWORD:-polyglot}
      - DB_NAME=${DB_NAME:-polyglot_prod}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - APP_PORT=4000
      - APP_HOST=polyglot
      - LOG_LEVEL=info
      # gRPC Configuration (Phase 2)
      - GO_PROCESSOR_URL=http://go-processor:8080
      - GO_PROCESSOR_GRPC_HOST=go-processor
      - GO_PROCESSOR_GRPC_PORT=9090
      - USE_GRPC=true
      - SENTRY_DSN=${SENTRY_DSN:-false}
    restart: unless-stopped
    networks:
      - polyglot-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    # Scale with: docker-compose up --scale polyglot=3

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - polyglot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  go-processor:
    build:
      context: ./go_processor
      dockerfile: Dockerfile
    expose:
      - "8080"
      - "9090"
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - polyglot-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    # Scale with: docker-compose up --scale go-processor=2
    # Exposes both HTTP (8080) and gRPC (9090)

  # Optional: Uncomment when C++ is available
  # cpp-driver:
  #   build:
  #     context: ./cpp_driver
  #     dockerfile: Dockerfile
  #   expose:
  #     - "9090"
  #   restart: unless-stopped
  #   networks:
  #     - polyglot-network
  #   security_opt:
  #     - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:

networks:
  polyglot-network:
    driver: bridge
