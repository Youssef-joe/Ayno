<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Test Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h2 {
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 4px;
        }
        input, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        button:hover { background: #5568d3; }
        button:active { transform: scale(0.98); }
        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        button { flex: 1; }
        .status {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            height: 250px;
            overflow-y: auto;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
        }
        .log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-time {
            color: #999;
            font-size: 11px;
        }
        .log-msg {
            color: #333;
        }
        .log-error {
            color: #d9534f;
        }
        .log-success {
            color: #5cb85c;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- WebSocket Panel -->
        <div class="panel">
            <h2>🔌 WebSocket Test</h2>
            <div id="ws-status" class="status disconnected">Disconnected</div>
            
            <div class="input-group">
                <label>Server URL</label>
                <input type="text" id="ws-url" value="ws://localhost:4000/socket" placeholder="ws://localhost:4000/socket">
            </div>
            
            <div class="input-group">
                <label>App ID</label>
                <input type="text" id="app-id" value="test-app" placeholder="test-app">
            </div>
            
            <div class="input-group">
                <label>Channel</label>
                <input type="text" id="channel" value="room:test" placeholder="room:test">
            </div>
            
            <div class="input-group">
                <label>Token</label>
                <input type="text" id="token" value="valid_token_user123" placeholder="valid_token_user123">
            </div>
            
            <div class="button-group">
                <button onclick="wsConnect()">Connect</button>
                <button onclick="wsDisconnect()">Disconnect</button>
            </div>
            
            <div class="input-group">
                <label>Message to Send</label>
                <textarea id="ws-message" placeholder='{"type":"message","data":{"text":"Hello"}}' rows="3"></textarea>
            </div>
            
            <button onclick="wsSendMessage()" style="width: 100%; margin-bottom: 12px;">Send Message</button>
            
            <label>Events Received:</label>
            <div id="ws-log" class="log"></div>
        </div>

        <!-- HTTP Panel -->
        <div class="panel">
            <h2>📡 HTTP API Test</h2>
            
            <div class="input-group">
                <label>Base URL</label>
                <input type="text" id="http-url" value="http://localhost:4000" placeholder="http://localhost:4000">
            </div>
            
            <div class="input-group">
                <label>App ID</label>
                <input type="text" id="http-app-id" value="test-app" placeholder="test-app">
            </div>
            
            <div class="input-group">
                <label>Channel</label>
                <input type="text" id="http-channel" value="room:test" placeholder="room:test">
            </div>
            
            <div class="input-group">
                <label>API Key</label>
                <input type="text" id="api-key" value="valid_key_test-app" placeholder="valid_key_test-app">
            </div>
            
            <div class="input-group">
                <label>Event Payload</label>
                <textarea id="http-message" placeholder='{"type":"message","data":{"text":"Hello from HTTP"}}' rows="3">{"type":"message","data":{"text":"Hello from HTTP"}}</textarea>
            </div>
            
            <div class="button-group">
                <button onclick="httpPublish()">Publish Event</button>
                <button onclick="httpHistory()">Get History</button>
            </div>
            
            <div class="button-group">
                <button onclick="httpHealth()">Health Check</button>
                <button onclick="httpReady()">Ready Check</button>
            </div>
            
            <label>Responses:</label>
            <div id="http-log" class="log"></div>
        </div>
    </div>

    <script>
        let socket = null;
        let channel = null;

        // WebSocket Functions
        function wsConnect() {
            const url = document.getElementById('ws-url').value;
            const appId = document.getElementById('app-id').value;
            const token = document.getElementById('token').value;

            try {
                socket = new WebSocket(url + `?app_id=${appId}&token=${token}`);
                
                socket.onopen = () => {
                    updateWsStatus(true);
                    logWs('Connected to WebSocket', 'success');
                    joinChannel();
                };
                
                socket.onmessage = (e) => {
                    logWs('Message: ' + e.data);
                };
                
                socket.onerror = (e) => {
                    logWs('Error: ' + e, 'error');
                };
                
                socket.onclose = () => {
                    updateWsStatus(false);
                    logWs('Disconnected', 'error');
                };
            } catch (e) {
                logWs('Connection failed: ' + e.message, 'error');
            }
        }

        function wsDisconnect() {
            if (socket) {
                socket.close();
                socket = null;
            }
        }

        function joinChannel() {
            const channelName = document.getElementById('channel').value;
            // For now, just log. Real Phoenix client would be needed for full functionality
            logWs(`Subscribing to channel: ${channelName}`, 'success');
        }

        function wsSendMessage() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                logWs('Not connected', 'error');
                return;
            }

            const message = document.getElementById('ws-message').value;
            try {
                socket.send(message);
                logWs('Sent: ' + message, 'success');
            } catch (e) {
                logWs('Send failed: ' + e.message, 'error');
            }
        }

        function updateWsStatus(connected) {
            const status = document.getElementById('ws-status');
            if (connected) {
                status.textContent = '✓ Connected';
                status.className = 'status connected';
            } else {
                status.textContent = '✗ Disconnected';
                status.className = 'status disconnected';
            }
        }

        function logWs(message, type = 'msg') {
            const log = document.getElementById('ws-log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${escapeHtml(message)}</span>`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // HTTP Functions
        async function httpPublish() {
            const baseUrl = document.getElementById('http-url').value;
            const appId = document.getElementById('http-app-id').value;
            const channel = document.getElementById('http-channel').value;
            const apiKey = document.getElementById('api-key').value;
            const payload = document.getElementById('http-message').value;

            const url = `${baseUrl}/apps/${appId}/channels/${channel}/publish`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: payload
                });

                const data = await response.json();
                logHttp(`[${response.status}] Publish: ${JSON.stringify(data)}`, response.ok ? 'success' : 'error');
            } catch (e) {
                logHttp(`Error: ${e.message}`, 'error');
            }
        }

        async function httpHistory() {
            const baseUrl = document.getElementById('http-url').value;
            const appId = document.getElementById('http-app-id').value;
            const channel = document.getElementById('http-channel').value;

            const url = `${baseUrl}/apps/${appId}/channels/${channel}/history`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                logHttp(`[${response.status}] History: ${JSON.stringify(data).substring(0, 200)}...`, 'success');
            } catch (e) {
                logHttp(`Error: ${e.message}`, 'error');
            }
        }

        async function httpHealth() {
            const baseUrl = document.getElementById('http-url').value;
            const url = `${baseUrl}/health`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                logHttp(`[${response.status}] Health: ${JSON.stringify(data)}`, 'success');
            } catch (e) {
                logHttp(`Error: ${e.message}`, 'error');
            }
        }

        async function httpReady() {
            const baseUrl = document.getElementById('http-url').value;
            const url = `${baseUrl}/ready`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                logHttp(`[${response.status}] Ready: ${JSON.stringify(data)}`, response.status === 200 ? 'success' : 'error');
            } catch (e) {
                logHttp(`Error: ${e.message}`, 'error');
            }
        }

        function logHttp(message, type = 'msg') {
            const log = document.getElementById('http-log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${escapeHtml(message)}</span>`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
